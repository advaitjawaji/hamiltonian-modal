[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamiltonian-modal"
version = "0.1.0"
description = "End-to-end differentiable Hamiltonian-modal foundation policies for humanoid robots"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.13"
authors = [{name = "hamiltonian-modal contributors", email = "jawajiadvait@gmail.com"}]
keywords = ["robotics", "humanoid", "differentiable-physics", "world-models", "foundation-policies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scipy>=1.13.0",
    "numpy>=1.26.0,<2.0",
    "wandb>=0.17.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-xdist>=3.6.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-tqdm",
    "hypothesis>=6.0.0",
]
jax = [
    "jax[cpu]>=0.4.30",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "equinox>=0.11.0",
    "diffrax>=0.5.0",
]
genesis = [
    "genesis-world>=0.4.5",
]
robotics = [
    "pin>=3.0.0",
]
torch = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]
datasets = [
    "datasets>=2.20.0",
    "huggingface-hub>=0.23.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/advaitjawaji/hamiltonian-modal"
Issues = "https://github.com/advaitjawaji/hamiltonian-modal/issues"
Documentation = "https://advaitjawaji.github.io/hamiltonian-modal/"

[project.scripts]
hm-train-wm = "scripts.train_world_model:main"
hm-train-policy = "scripts.train_diff_sim_policy:main"
hm-mcts-recovery = "scripts.run_mcts_recovery:main"
hm-effbench = "scripts.run_diffsim_effbench:main"
hm-driftbench = "scripts.run_driftbench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hamiltonian_modal*", "benchmarks*", "baselines*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests that take >10s",
    "gpu: tests that require GPU",
    "genesis: tests that require Genesis simulator",
    "jax: tests that require JAX",
]
